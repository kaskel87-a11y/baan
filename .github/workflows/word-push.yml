name: Word notifications

on:
  schedule:
    # Every hour. The script sends only at the New York hours for each subscription.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: Send one word now, ignoring the clock
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install web-push@3 --no-save
      - name: Restore which words already went out
        uses: actions/cache/restore@v4
        with:
          path: .push-state.json
          key: push-state-${{ github.run_id }}
          restore-keys: push-state-
      - name: Send
        run: npx tsx scripts/send-word-push.ts
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
          PUSH_TEST: ${{ inputs.test }}
      - name: Remember the words sent
        uses: actions/cache/save@v4
        if: success() && hashFiles('.push-state.json') != ''
        with:
          path: .push-state.json
          key: push-state-${{ github.run_id }}
